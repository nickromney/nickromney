<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nick Romney profile header</title>
  <desc id="desc">Editorial-style profile banner with restrained blue-led branding and project strands across banking modernisation, platform self-service, AWS resilience, and AKS enablement.</desc>
  <defs>
