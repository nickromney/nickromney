<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nick Romney profile header</title>
  <desc id="desc">Editorial-style banner with the name Nick Romney and a summary of cloud, Kubernetes, security, and documentation work.</desc>
  <rect width="1200" height="320" rx="24" fill="#F7F3EA"/>
  <rect x="32" y="32" width="1136" height="256" rx="18" fill="#111827"/>
